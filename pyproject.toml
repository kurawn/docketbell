[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]  # generated by Django

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
